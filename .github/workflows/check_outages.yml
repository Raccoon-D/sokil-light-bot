name: Energy Bot
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libdbus-glib-1-2 libnss3 \
            libasound2t64 libatk-bridge2.0-0 libcups2 fonts-liberation

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch Camoufox browser
        run: camoufox fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run bot
        run: |
          python - <<'EOF'
          p = "main.py"
          lines = open(p, encoding="utf-8").readlines()
          if len(lines) >= 304:
              lines[303] = '                f"Інтервал: {start:%H:%M}–{end:%H:%M}\\n\\n"\n'
          s = "".join(lines)
          s = s.replace("await page.wait_for_timeout(8000)", "await page.wait_for_timeout(15000)")
          if "DEBUG_REPORT" not in s:
              s = s.replace('PROXY_URL = os.getenv("PROXY_URL", "").strip() or None', 'PROXY_URL = os.getenv("PROXY_URL", "").strip() or None\nDEBUG_REPORT = True')
              s = s.replace("events = extract_events(text)", 'events = extract_events(text)\n    if DEBUG_REPORT:\n        telegram_send("DEBUG 4.1: " + (", ".join(f"{a:%Y-%m-%d %H:%M}-{b:%H:%M}" for a,b in events) or "none") + "\\n" + text[:2200])')
          open(p, "w", encoding="utf-8").write(s)
          EOF
          xvfb-run -a python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          RUN_ONCE: "1"

      - name: Save state if updated
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            if ! git diff --staged --quiet; then
              git commit -m "Update notified outage state [skip ci]"
              git push
            fi
          fi
